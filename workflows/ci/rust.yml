name: Rust CI

permissions:
  contents: read
  actions: write

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: komrad-company/Kompile-Konquer/actions/rust/build@main

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: komrad-company/Kompile-Konquer/actions/rust/tests@main

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: komrad-company/Kompile-Konquer/actions/rust/fmt@main
        with:
          continue-on-error: false

      - uses: komrad-company/Kompile-Konquer/actions/rust/clippy@main

  release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: action/checkout@v4

      - uses: komrad-company/Kompile-Konquer/actions/rust/release@main
