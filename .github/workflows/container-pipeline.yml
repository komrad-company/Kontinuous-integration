name: Container Pipeline

on:
  workflow_call:
    inputs:
      image:
        description: "Image name without registry or tag (e.g. korelator)"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: false
        type: string
        default: "."
      containerfile:
        description: "Path to the Containerfile or Dockerfile"
        required: false
        type: string
        default: "./Containerfile"
      platforms:
        description: "Comma-separated list of target platforms"
        required: false
        type: string
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on:
      labels: komrad-runners
    steps:
      - uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          push="false"
          tags="ci-build"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            push="false"
            tags="ci-build"
          elif [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            push="true"
            tags="sha-${short_sha}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if echo "$version" | grep -q '\-rc\.'; then
              push="true"
              tags="${version}"
            else
              major_minor=$(echo "$version" | cut -d. -f1,2)
              push="true"
              tags="${version} ${major_minor} latest"
            fi
          fi

          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Build with docker: the komrad-runners are ARC pods with a DinD
      # sidecar — docker is the only build tool available there. The buildah
      # composite action requires a host buildah binary and a privileged
      # context; it returns once the runners ship a custom image.
      - name: Login to registry
        if: steps.meta.outputs.push == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build image
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          BUILD_CONTEXT: ${{ inputs.context }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ "$PLATFORMS" != "linux/amd64" ]; then
            echo "WARNING: docker single-platform build — '$PLATFORMS' ignored, building linux/amd64"
          fi
          tag_args=()
          for t in $TAGS; do
            tag_args+=(-t "ghcr.io/komrad-company/${IMAGE}:${t}")
          done
          docker build "${tag_args[@]}" -f "$CONTAINERFILE" "$BUILD_CONTEXT"

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker push "ghcr.io/komrad-company/${IMAGE}:${t}"
          done
