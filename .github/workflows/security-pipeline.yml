name: Security — Secrets detection

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
        description: "Webhook Slack pour les alertes CI (optionnel)"

jobs:
  secret_detection:
    name: gitleaks
    runs-on:
      labels: komrad-runners
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks detect --source . --verbose

  notify-slack:
    needs:
      - secret_detection
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on:
      labels: komrad-runners
    steps:
      - uses: actions/checkout@v5
      - uses: komrad-company/Kontinuous-integration/.github/actions/notify/slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
