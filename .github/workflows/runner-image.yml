name: Runner image

on:
  push:
    branches: [main]
    paths: ["runners/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner: buildah is preinstalled, and the komrad-runner
    # image cannot build itself before it exists.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/container/buildah
        with:
          image: komrad-runner
          tags: latest
          containerfile: ./runners/komrad-runner/Containerfile
          context: ./runners/komrad-runner
          push: "true"
          registry: ghcr.io/komrad-company
          username: ${{ github.actor }}
          password: ${{ github.token }}
