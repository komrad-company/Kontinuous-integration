name: Rust - Run lint
description: "Run lint for crate"

inputs:
  continue-on-error:
    default: 'false'


runs:
    using: "composite"
    steps:
        - run: rustup component add rustfmt
          shell: bash

        - run: cargo fmt --check
          continue-on-error: ${{ inputs.continue-on-error == 'true' }}
          shell: bash
