name: Rust - Run lint
description: "Run lint for crate"

inputs:
  continue-on-error:
    default: false


runs:
    using: "composite"
    steps:
        - uses: komrad-company/Kontinuous-integration/.github/actions/rust/setup-toolchain@main

        - run: cargo fmt --check
          continue-on-error: ${{ inputs.continue-continue-on-error }}
          shell: bash
