name: Slack - CI notification
description: "Envoie une alerte Slack avec le statut de la CI"

inputs:
  webhook-url:
    description: "URL du webhook Slack (incoming webhook)"
    required: true
  status:
    description: "Statut à notifier (success, failure, cancelled)"
    required: true
    default: failure

runs:
  using: "composite"
  steps:
    - name: Send Slack notification
      if: ${{ inputs.webhook-url != '' }}
      uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ inputs.webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "CI ${{ inputs.status }} — ${{ github.repository }}@${{ github.ref_name }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "CI ${{ inputs.status }} — ${{ github.repository }}"
                }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Branch / tag*\n`${{ github.ref_name }}`" },
                  { "type": "mrkdwn", "text": "*Commit*\n`${{ github.sha }}`" },
                  { "type": "mrkdwn", "text": "*Workflow*\n${{ github.workflow }}" },
                  { "type": "mrkdwn", "text": "*Acteur*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "Voir le run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
