name: Slack - CI notification
description: "Sends a Slack alert with the CI status"

inputs:
  webhook-url:
    description: "Slack webhook URL (incoming webhook)"
    required: true
  status:
    description: "Status to notify (success, failure, cancelled)"
    required: true
    default: failure

runs:
  using: "composite"
  steps:
    - name: Send Slack notification
      if: ${{ inputs.webhook-url != '' }}
      uses: slackapi/slack-github-action@v3.0.3
      with:
        webhook: ${{ inputs.webhook-url }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "☭ URGENT TRANSMISSION FROM THE CENTRAL COMMITTEE: CI ${{ inputs.status }} — ${{ github.repository }}@${{ github.ref_name }}. FAILURE IS NOT AN OPTION. THE PARTY IS WATCHING. ☭",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "☭ URGENT TRANSMISSION FROM THE CENTRAL COMMITTEE: CI ${{ inputs.status }} — ${{ github.repository }}@${{ github.ref_name }}. FAILURE IS NOT AN OPTION. THE PARTY IS WATCHING. ☭",
                }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Branch / tag*\n`${{ github.ref_name }}`" },
                  { "type": "mrkdwn", "text": "*Commit*\n`${{ github.sha }}`" },
                  { "type": "mrkdwn", "text": "*Workflow*\n${{ github.workflow }}" },
                  { "type": "mrkdwn", "text": "*Actor*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
