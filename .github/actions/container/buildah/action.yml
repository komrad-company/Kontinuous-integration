name: Container - Buildah
description: "Build an OCI image with Buildah and optionally push it to a registry."

inputs:
    image:
        description: "Image name without registry or tag (e.g. korelator)"
        required: true
    tags:
        description: "Space-separated list of tags to apply"
        required: false
        default: "latest"
    containerfile:
        description: "Path to the Containerfile"
        required: false
        default: "./Containerfile"
    context:
        description: "Build context directory"
        required: false
        default: "."
    platforms:
        description: "Comma-separated target platforms"
        required: false
        default: "linux/amd64"
    push:
        description: "Push the image after build"
        required: false
        default: "false"
    registry:
        description: "Registry to push to (required when push=true)"
        required: false
        default: ""
    username:
        description: "Registry username (required when push=true)"
        required: false
        default: ""
    password:
        description: "Registry password or token (required when push=true)"
        required: false
        default: ""

# Buildah is invoked directly under sudo: on the komrad-runners ARC pods the
# runner user cannot use user namespaces (apparmor_restrict_unprivileged_userns
# on the nodes), so builds run as root with CAP_SYS_ADMIN and chroot isolation.
# The same invocation works unchanged on GitHub-hosted runners.
runs:
    using: "composite"
    steps:
        - name: Build image
          shell: bash
          env:
              IMAGE: ${{ inputs.image }}
              TAGS: ${{ inputs.tags }}
              CONTAINERFILE: ${{ inputs.containerfile }}
              BUILD_CONTEXT: ${{ inputs.context }}
              PLATFORMS: ${{ inputs.platforms }}
              LABEL_SOURCE: ${{ github.server_url }}/${{ github.repository }}
              LABEL_REVISION: ${{ github.sha }}
              LABEL_REF: ${{ github.ref_name }}
          run: |
              tag_args=()
              for t in $TAGS; do
                tag_args+=(-t "${IMAGE}:${t}")
              done
              sudo buildah bud \
                --format oci \
                --isolation chroot \
                --platform "$PLATFORMS" \
                --label "org.opencontainers.image.source=$LABEL_SOURCE" \
                --label "org.opencontainers.image.revision=$LABEL_REVISION" \
                --label "org.opencontainers.image.ref.name=$LABEL_REF" \
                -f "$CONTAINERFILE" "${tag_args[@]}" "$BUILD_CONTEXT"

        - name: Push image
          if: ${{ inputs.push == 'true' }}
          shell: bash
          env:
              IMAGE: ${{ inputs.image }}
              TAGS: ${{ inputs.tags }}
              REGISTRY: ${{ inputs.registry }}
              REGISTRY_USERNAME: ${{ inputs.username }}
              REGISTRY_PASSWORD: ${{ inputs.password }}
          run: |
              echo "$REGISTRY_PASSWORD" | sudo buildah login -u "$REGISTRY_USERNAME" --password-stdin "${REGISTRY%%/*}"
              for t in $TAGS; do
                sudo buildah push "${IMAGE}:${t}" "docker://${REGISTRY}/${IMAGE}:${t}"
              done
